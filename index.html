<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#141512" />
    <title>🎲</title>

    <style>
      :root {
        --bg: #141512;
        --panel: #20211d;
        --text: #f5f4ee;
        --muted: #999a91;
        --yellow: #ffbc0d;
        --red: #a9231b;
        --green: #17643b;
        --line: #35362f;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        min-height: 100%;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      button {
        font: inherit;
        color: inherit;
      }

      button:focus-visible {
        outline: 2px solid white;
        outline-offset: 4px;
      }

      .background-shape {
        position: fixed;
        z-index: -1;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        filter: blur(75px);
        opacity: 0.07;
        pointer-events: none;
        animation: ambient 8s ease-in-out infinite alternate;
      }

      .shape-red {
        background: #d52c20;
        top: 5%;
        left: -150px;
      }

      .shape-green {
        background: #20a05a;
        bottom: 5%;
        right: -150px;
        animation-delay: -4s;
      }

      .app {
        width: 100%;
        max-width: 520px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0 auto;
        padding: max(25px, env(safe-area-inset-top)) 18px
          max(25px, env(safe-area-inset-bottom));

        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .battle {
        display: flex;
        flex-direction: column;
        gap: 14px;
        perspective: 1000px;
      }

      .restaurant {
        position: relative;
        isolation: isolate;
        width: 100%;
        min-height: 250px;
        padding: 23px;
        overflow: hidden;

        display: flex;
        flex-direction: column;
        align-items: flex-start;

        border: 1px solid var(--line);
        border-radius: 17px;

        animation: card-enter 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) both;

        transition:
          transform 0.35s ease,
          border-color 0.35s ease,
          opacity 0.35s ease,
          background-color 0.35s ease;
      }

      .mcd {
        background: #291c19;
        border-color: #49302b;
        animation-delay: 0.1s;
      }

      .subway {
        background: #19271e;
        border-color: #304735;
        animation-delay: 0.3s;
      }

      .restaurant::before,
      .restaurant::after {
        content: "";
        position: absolute;
        z-index: -1;
        border: 1px solid #ffffff0b;
        border-radius: 50%;
        pointer-events: none;
      }

      .restaurant::before {
        width: 180px;
        height: 180px;
        top: -90px;
        right: -65px;
        animation: orbit 12s linear infinite;
      }

      .restaurant::after {
        width: 120px;
        height: 120px;
        top: -60px;
        right: -35px;
        animation: orbit 9s linear infinite reverse;
      }

      .label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border: 1px solid #ffffff16;
        border-radius: 5px;
        background: #00000014;
        color: #d0d0c7;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 1.4px;
      }

      .label-number {
        color: var(--yellow);
      }

      .brand {
        margin-top: 23px;
        margin-bottom: 12px;
        font-weight: 950;
        line-height: 1;
        user-select: none;
        transform-origin: left center;
      }

      .mcd .brand {
        color: var(--yellow);
        font-size: 68px;
        letter-spacing: -6px;
        animation: brand-float 4s ease-in-out infinite;
      }

      .subway .brand {
        color: var(--yellow);
        font-size: clamp(39px, 12vw, 53px);
        letter-spacing: -3px;
        animation: brand-float 4s ease-in-out infinite;
        animation-delay: -1.5s;
      }

      .restaurant h2 {
        margin-bottom: 21px;
        font-size: 27px;
        font-weight: 850;
        letter-spacing: -0.7px;
      }

      .divider {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 1px;
        position: relative;
        z-index: 2;
      }

      .vs {
        position: absolute;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid #41423b;
        border-radius: 50%;
        background: var(--bg);
        color: #bcbdb4;
        font-size: 9px;
        font-weight: 900;
        animation: vs-turn 7s ease-in-out infinite;
      }

      .decision {
        margin-top: 23px;
        animation: slide-up 0.7s 0.45s both;
      }

      .random-btn {
        position: relative;
        width: 100%;
        min-height: 60px;
        padding: 0 18px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        border: 1px solid #e6ad00;
        border-radius: 10px;
        background: var(--yellow);
        color: #211b0b;
        font-size: 12px;
        font-weight: 950;
        letter-spacing: 0.6px;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          background-color 0.2s ease;
      }

      .random-btn::after {
        content: "";
        position: absolute;
        top: 0;
        left: -110%;
        width: 55%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #ffffff35, transparent);
        transform: skewX(-20deg);
        animation: button-sweep 4s 1s infinite;
        pointer-events: none;
      }

      .random-btn:active {
        transform: scale(0.97);
      }

      .random-btn:disabled {
        cursor: default;
        opacity: 0.8;
      }

      .dice {
        display: inline-block;
        font-size: 21px;
        line-height: 1;
      }

      .rolling .dice {
        animation: dice-roll 0.32s linear infinite;
      }

      .rolling {
        animation: button-pulse 0.65s ease-in-out infinite alternate;
      }

      .countdown {
        display: none;
        margin-top: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 2px;
      }

      .countdown.visible {
        display: block;
        animation: slide-up 0.25s both;
      }

      .count-number {
        display: block;
        margin-top: 7px;
        color: var(--yellow);
        font-size: 60px;
        font-weight: 950;
        letter-spacing: -3px;
        animation: number-pop 0.55s cubic-bezier(0.2, 1.6, 0.4, 1) both;
      }

      .result {
        display: none;
        margin-top: 18px;
        padding: 25px 18px;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 13px;
      }

      .result.visible {
        display: block;
        animation: result-enter 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .result-emoji {
        font-size: 48px;
        margin-bottom: 12px;
        animation: emoji-pop 0.7s cubic-bezier(0.2, 1.5, 0.5, 1) both;
      }

      .result h2 {
        font-size: 29px;
        font-weight: 900;
        letter-spacing: -1px;
        animation: slide-up 0.45s 0.1s both;
      }

      .result p {
        margin-top: 9px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
        animation: slide-up 0.45s 0.18s both;
      }

      .again-btn {
        width: 100%;
        min-height: 47px;
        margin-top: 20px;
        padding: 12px;
        border: 1px solid #45463f;
        border-radius: 8px;
        background: #292a26;
        color: var(--text);
        font-size: 11px;
        font-weight: 850;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          transform 0.2s ease;
      }

      .again-btn:active {
        transform: scale(0.98);
      }

      .winner {
        border-color: var(--yellow) !important;
        animation: winner-card 0.75s ease both;
      }

      .subway.winner {
        border-color: var(--yellow) !important;
      }

      .loser {
        opacity: 0.35;
        transform: scale(0.97);
      }

      .mcd.winner {
        background: #38211c;
      }

      .subway.winner {
        background: #1b3021;
      }

      .winner .brand {
        animation: winner-brand 0.8s ease both;
      }

      .confetti-piece {
        position: fixed;
        z-index: 100;
        top: -15px;
        left: var(--x);
        width: var(--size);
        height: calc(var(--size) * 1.5);
        border-radius: 2px;
        background: var(--color);
        pointer-events: none;
        animation: confetti-fall var(--duration) cubic-bezier(0.2, 0.6, 0.5, 1)
          forwards;
        animation-delay: var(--delay);
      }

      @keyframes card-enter {
        0% {
          opacity: 0;
          transform: translateY(28px) scale(0.94) rotateX(5deg);
        }
        65% {
          opacity: 1;
          transform: translateY(-3px) scale(1.01);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1) rotateX(0);
        }
      }

      @keyframes slide-up {
        from {
          opacity: 0;
          transform: translateY(13px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes brand-float {
        0%,
        100% {
          transform: translateY(0) rotate(0);
        }
        50% {
          transform: translateY(-5px) rotate(-1deg);
        }
      }

      @keyframes ambient {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(30px, -20px) scale(1.15);
        }
      }

      @keyframes orbit {
        from {
          transform: rotate(0deg) scale(1);
        }
        50% {
          transform: rotate(180deg) scale(1.08);
        }
        to {
          transform: rotate(360deg) scale(1);
        }
      }

      @keyframes vs-turn {
        0%,
        85%,
        100% {
          transform: rotate(0);
        }
        92% {
          transform: rotate(180deg);
        }
      }

      @keyframes button-sweep {
        0%,
        68% {
          left: -110%;
        }
        92%,
        100% {
          left: 150%;
        }
      }

      @keyframes dice-roll {
        0% {
          transform: rotate(0) scale(1);
        }
        50% {
          transform: rotate(180deg) scale(1.3);
        }
        100% {
          transform: rotate(360deg) scale(1);
        }
      }

      @keyframes button-pulse {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(0.985);
        }
      }

      @keyframes number-pop {
        from {
          opacity: 0;
          transform: scale(0.4) rotate(-10deg);
        }
        70% {
          transform: scale(1.15) rotate(3deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0);
        }
      }

      @keyframes result-enter {
        0% {
          opacity: 0;
          transform: translateY(22px) scale(0.92);
        }
        70% {
          opacity: 1;
          transform: translateY(-3px) scale(1.015);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes emoji-pop {
        0% {
          opacity: 0;
          transform: scale(0.2) rotate(-25deg);
        }
        65% {
          opacity: 1;
          transform: scale(1.25) rotate(8deg);
        }
        82% {
          transform: scale(0.9) rotate(-4deg);
        }
        100% {
          transform: scale(1) rotate(0);
        }
      }

      @keyframes winner-card {
        0%,
        100% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.035);
        }
        60% {
          transform: scale(0.995);
        }
        80% {
          transform: scale(1.012);
        }
      }

      @keyframes winner-brand {
        0%,
        100% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.15) rotate(-3deg);
        }
        65% {
          transform: scale(0.96) rotate(2deg);
        }
      }

      @keyframes confetti-fall {
        0% {
          opacity: 1;
          transform: translate3d(0, -10px, 0) rotate(0);
        }
        100% {
          opacity: 0;
          transform: translate3d(var(--drift), 105vh, 0) rotate(var(--rotation));
        }
      }

      @media (max-width: 360px) {
        .app {
          padding-left: 13px;
          padding-right: 13px;
        }

        .restaurant {
          min-height: 230px;
          padding: 19px;
        }

        .mcd .brand {
          font-size: 59px;
        }

        .subway .brand {
          font-size: 37px;
        }

        .restaurant h2 {
          font-size: 24px;
        }

        .random-btn {
          font-size: 11px;
        }
      }

      @media (max-height: 650px) and (orientation: landscape) {
        .app {
          max-width: 850px;
          padding-top: 20px;
          padding-bottom: 20px;
        }

        .battle {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 14px;
        }

        .restaurant {
          min-height: 220px;
        }

        .mcd .brand {
          font-size: 53px;
        }

        .subway .brand {
          font-size: 37px;
        }

        .restaurant h2 {
          font-size: 23px;
        }

        .divider {
          display: none;
        }

        .decision {
          max-width: 420px;
          width: 100%;
          margin: 18px auto 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="background-shape shape-red"></div>
    <div class="background-shape shape-green"></div>

    <main class="app">
      <section class="battle" aria-label="Zufällige Restaurantentscheidung">
        <article class="restaurant mcd" id="mcd">
          <div class="brand" aria-label="McDonald's">Mcs</div>
          <h2>🍔</h2>
        </article>

        <div class="divider" aria-hidden="true">
          <span class="vs">VS</span>
        </div>

        <article class="restaurant subway" id="subway">
          <div class="brand">SUBWAY</div>
          <h2>🥪</h2>
        </article>
      </section>

      <section class="decision">
        <button class="random-btn" id="randomBtn" onclick="randomDecision()">
          <span class="dice" id="dice">🎲</span>
          <span id="randomLabel">ZUFÄLLIG ENTSCHEIDEN</span>
        </button>
      </section>

      <section class="countdown" id="countdown" aria-live="polite">
        ENTSCHEIDUNG LÄUFT
        <span class="count-number" id="countNumber">3</span>
      </section>

      <section class="result" id="result" aria-live="polite" aria-atomic="true">
        <div class="result-emoji" id="resultEmoji">🍔</div>
        <h2 id="resultTitle">McDonald's</h2>
        <button class="again-btn" onclick="resetDecision()">↻ NOCHMAL</button>
      </section>
    </main>

    <script>
      const restaurants = {
        mcd: {
          name: "McDonald's",
          emoji: "🍔",
        },
        subway: {
          name: "Subway",
          emoji: "🥪",
        },
      };

      let isBusy = false;

      const randomBtn = document.getElementById("randomBtn");
      const randomLabel = document.getElementById("randomLabel");
      const dice = document.getElementById("dice");
      const countdown = document.getElementById("countdown");
      const countNumber = document.getElementById("countNumber");
      const result = document.getElementById("result");

      const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      );

      function delay(ms) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      async function randomDecision() {
        if (isBusy) return;

        isBusy = true;

        result.classList.remove("visible");
        countdown.classList.remove("visible");

        document.querySelectorAll(".restaurant").forEach((card) => {
          card.classList.remove("winner", "loser");
        });

        randomBtn.disabled = true;
        randomBtn.classList.add("rolling");
        randomLabel.textContent = "WIRD AUSGEWÄHLT ...";

        countdown.classList.add("visible");

        const steps = reduceMotion.matches ? [1] : [3, 2, 1];

        for (const number of steps) {
          countNumber.textContent = number;
          countNumber.style.animation = "none";
          void countNumber.offsetWidth;
          countNumber.style.animation = "";

          if (!reduceMotion.matches) {
            await delay(700);
          }
        }

        if (reduceMotion.matches) {
          await delay(150);
        }

        const winner = Math.random() < 0.5 ? "mcd" : "subway";
        const selected = restaurants[winner];
        const other = winner === "mcd" ? "subway" : "mcd";

        document.getElementById(winner).classList.add("winner");
        document.getElementById(other).classList.add("loser");

        document.getElementById("resultEmoji").textContent = selected.emoji;
        document.getElementById("resultTitle").textContent = selected.name;

        countdown.classList.remove("visible");
        randomBtn.classList.remove("rolling");

        result.classList.remove("visible");
        void result.offsetWidth;
        result.classList.add("visible");

        randomBtn.disabled = false;
        randomLabel.textContent = "NOCHMAL ENTSCHEIDEN";
        dice.textContent = "🎲";

        createConfetti();

        result.scrollIntoView({
          behavior: reduceMotion.matches ? "auto" : "smooth",
          block: "nearest",
        });

        isBusy = false;
      }

      function createConfetti() {
        if (reduceMotion.matches) return;

        const colors = ["#ffbc0d", "#a9231b", "#17643b", "#f5f4ee", "#e7a92d"];

        const fragment = document.createDocumentFragment();

        for (let i = 0; i < 75; i++) {
          const piece = document.createElement("div");
          piece.className = "confetti-piece";

          const size = 4 + Math.random() * 6;
          const duration = 1.8 + Math.random() * 1.8;
          const delayTime = Math.random() * 0.5;

          piece.style.setProperty("--x", Math.random() * 100 + "vw");
          piece.style.setProperty("--size", size + "px");
          piece.style.setProperty(
            "--color",
            colors[Math.floor(Math.random() * colors.length)],
          );
          piece.style.setProperty("--duration", duration + "s");
          piece.style.setProperty("--delay", delayTime + "s");
          piece.style.setProperty(
            "--drift",
            (Math.random() - 0.5) * 180 + "px",
          );
          piece.style.setProperty(
            "--rotation",
            (Math.random() - 0.5) * 1200 + "deg",
          );

          fragment.appendChild(piece);

          window.setTimeout(
            () => piece.remove(),
            (duration + delayTime) * 1000,
          );
        }

        document.body.appendChild(fragment);
      }

      function resetDecision() {
        if (isBusy) return;

        document.querySelectorAll(".restaurant").forEach((card) => {
          card.classList.remove("winner", "loser");
        });

        result.classList.remove("visible");
        countdown.classList.remove("visible");

        randomBtn.disabled = false;
        randomBtn.classList.remove("rolling");
        dice.textContent = "🎲";
        randomLabel.textContent = "ZUFÄLLIG ENTSCHEIDEN";

        window.scrollTo({
          top: 0,
          behavior: reduceMotion.matches ? "auto" : "smooth",
        });
      }
    </script>
  </body>
</html>
